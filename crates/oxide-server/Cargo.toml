[package]
name = "oxide-server"
description = "Drop-in replacement for the Cloud Datastore emulator (cloud_datastore_emulator)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[[bin]]
name = "datastore-oxide"
path = "src/main.rs"

[dependencies]
oxide-api.workspace = true
oxide-engine.workspace = true
oxide-model.workspace = true
oxide-proto.workspace = true

anyhow.workspace = true
base64.workspace = true
bytes.workspace = true
prost.workspace = true
http.workspace = true
http-body-util.workspace = true
hyper.workspace = true
hyper-util.workspace = true
tokio.workspace = true
socket2 = "0.6"
tonic.workspace = true
tonic-reflection = "0.14"
tower.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tikv-jemallocator = { version = "0.6", features = ["background_threads"] }

[dev-dependencies]
prost.workspace = true
ureq.workspace = true
serde_json.workspace = true
conformance.workspace = true
tempfile = "3"
tokio-stream = "0.1"
