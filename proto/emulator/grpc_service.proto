// The App Engine API server's call envelope (`apphosting.tools.devappserver2.CallHandler`), as
// datastore-oxide serves it. Written for datastore-oxide from the observable wire interface.
// Licensed under the Apache License, Version 2.0 (see LICENSE at the repository root).

syntax = "proto3";

package apphosting.tools.devappserver2;

service CallHandler {
  rpc HandleCall(Request) returns (Response);
}

message Request {
  string service_name = 2;
  string method = 3;
  bytes request = 4;
  string request_id = 5;
  string txn_add_task_callback_hostport = 6;
}

message Response {
  bytes response = 1;
  bytes exception = 2;
  ApplicationError application_error = 3;
  bytes java_exception = 4;
  RpcError rpc_error = 5;
}

message ApplicationError {
  int32 code = 1;
  string detail = 2;
}

message RpcError {
  enum ErrorCode {
    UNKNOWN = 0;
    CALL_NOT_FOUND = 1;
    PARSE_ERROR = 2;
    SECURITY_VIOLATION = 3;
    OVER_QUOTA = 4;
    REQUEST_TOO_LARGE = 5;
    CAPABILITY_DISABLED = 6;
    FEATURE_DISABLED = 7;
    BAD_REQUEST = 8;
    RESPONSE_TOO_LARGE = 9;
    CANCELLED = 10;
    REPLAY_ERROR = 11;
    DEADLINE_EXCEEDED = 12;
  }
  int32 code = 1;
  string detail = 2;
}
