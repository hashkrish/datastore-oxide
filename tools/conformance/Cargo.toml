[package]
name = "conformance"
description = "Scenario runner for comparing datastore-oxide with the Java emulator over REST"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
anyhow.workspace = true
bytes.workspace = true
http.workspace = true
http-body-util.workspace = true
hyper = { workspace = true, features = ["client"] }
hyper-util.workspace = true
oxide-json.workspace = true
oxide-proto.workspace = true
prost.workspace = true
prost-types.workspace = true
prost-reflect = { workspace = true, features = ["text-format"] }
tokio.workspace = true
serde_json.workspace = true
ureq.workspace = true

[[bin]]
name = "record-conformance"
path = "src/bin/record.rs"

[[bin]]
name = "record-projects"
path = "src/bin/record_projects.rs"
